fileType: momentic/mobile-test/v2
id: 38e779be-0005-4c00-9910-911ea26cd494
description: Create and inspect an expense in the Dime app
platform: ios
defaultChannel: dime
emulator:
  waitForStability: true
steps:
  - openApp:
      package: com.rafaelsoh.dime
      intentExtras: '["--my-argument", "my-value"]'
  - Complete onboarding, enable the Food and Transport categories, and create a $2 Food expense
  - assert: A single $2 Food expense appears in today's transactions
  - Open the Settings tab
  - checkScreenContains: Display Cents
