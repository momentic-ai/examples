name: AI explore (generate tests)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MOMENTIC_API_KEY: ${{ secrets.MOMENTIC_API_KEY }}

jobs:
  explore:
    name: Explore changed user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install headless browsers for automation
        run: npx momentic install-browsers chromium

      - name: Explore the change that landed
        if: github.event_name == 'push'
        run: npx momentic ai explore diff

      - name: Explore the whole app
        if: github.event_name == 'workflow_dispatch'
        run: npx momentic ai explore latest
