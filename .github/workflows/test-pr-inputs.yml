name: Test PR

env:
  MOMENTIC_API_KEY: ${{ secrets.MOMENTIC_API_KEY }}

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "npm"
      - name: Install dependencies
        run: npm --prefix ../ ci
      - name: Install headless browsers for automation
        # Choose which browsers you want to install, see https://momentic.ai/docs/browsers
        run: npx momentic install-browsers chromium
      - name: Run tests
        run: npx momentic run --upload-results --input-csv data/inputs.csv input-from-csv-test.test.yaml
