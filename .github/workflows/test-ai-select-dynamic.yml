name: AI-selected tests (dynamic matrix)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOMENTIC_API_KEY: ${{ secrets.MOMENTIC_API_KEY }}

jobs:
  select-tests:
    name: Select tests and define shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_tests: ${{ steps.matrix.outputs.has_tests }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      # AI Select needs the base commit and full diff, not a shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install code-index tools
        run: npx momentic@latest install-codetools
      - name: Restore code index
        uses: actions/cache@v4
        with:
          path: ~/.momentic/cache/
          key: momentic-code-index-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            momentic-code-index-v1-${{ runner.os }}-

      # Standalone mode computes one reusable plan for all downstream shards.
      # The compatibility check can be removed once --prompt is in the minimum
      # Momentic version supported by this example.
      - name: Select tests
        working-directory: web
        run: |
          PROMPT_ARGS=()
          if npx momentic@latest ai select --help | grep -q -- '--prompt'; then
            PROMPT_ARGS+=(
              --prompt
              "Prioritize authentication, cart state, sorting, and checkout behavior affected by this change."
            )
          fi

          npx momentic@latest ai select \
            --json \
            --budget 4 \
            --exclude autoheal-test-authorship-demo \
            "${PROMPT_ARGS[@]}" \
            > ai-selection.json

      # Turn the selected paths into a dynamic GitHub Actions matrix. The script
      # also handles valid zero-test selections and fail-open run-all plans.
      - name: Define dynamic shard matrix
        id: matrix
        run: |
          node .github/scripts/build-ai-select-matrix.mjs \
            web/ai-selection.json web >> "$GITHUB_OUTPUT"

  run-tests:
    name: Run selected tests (shard ${{ matrix.shard }}/${{ matrix.totalShards }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - select-tests
    if: needs['select-tests'].outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs['select-tests'].outputs.matrix) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm --prefix .. ci
      - name: Install browser
        run: npx momentic@latest install-browsers chromium
      - name: Run selected tests
        env:
          TEST_ARGS: ${{ matrix.testArgs }}
        run: |
          read -r -a SELECTED_TESTS <<< "$TEST_ARGS"
          npx momentic@latest run "${SELECTED_TESTS[@]}" \
            --output-dir "test-results/shard-${{ matrix.shard }}"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-selected-test-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 1

  upload-results:
    name: Merge and upload selected test results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - select-tests
      - run-tests
    if: always() && needs['select-tests'].outputs.has_tests == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: ai-selected-test-results-*
          merge-multiple: true
      # --allow-empty keeps shards without runs (e.g. a zero-test selection)
      # in the merged archive so their selection plans reach Momentic.
      - name: Merge test results
        run: npx momentic@latest results merge --allow-empty --output-dir test-results/merged test-results
      - name: Upload test results
        run: npx momentic@latest results upload test-results/merged

  # A valid zero-test selection skips the shard matrix entirely, so no run
  # group would ever be uploaded and the pull request would get no Momentic
  # comment. Running the selection in execution mode reuses the plan computed
  # above (zero tests execute), and the upload carries the plan so the pull
  # request comment can explain why nothing ran.
  report-zero-selection:
    name: Report zero-test selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - select-tests
    if: needs['select-tests'].outputs.has_tests == 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install code-index tools
        run: npx momentic@latest install-codetools
      - name: Restore code index
        uses: actions/cache@v4
        with:
          path: ~/.momentic/cache/
          key: momentic-code-index-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            momentic-code-index-v1-${{ runner.os }}-
      # Mirror the planning job's selection arguments exactly so this reuses
      # the plan computed above instead of resolving a new one.
      - name: Run zero-test selection
        working-directory: web
        run: |
          PROMPT_ARGS=()
          if npx momentic@latest run --help | grep -q -- '--prompt'; then
            PROMPT_ARGS+=(
              --prompt
              "Prioritize authentication, cart state, sorting, and checkout behavior affected by this change."
            )
          fi

          npx momentic@latest run . \
            --ai-select \
            --ai-select-budget 4 \
            --exclude autoheal-test-authorship-demo \
            "${PROMPT_ARGS[@]}"
      - name: Upload selection result
        working-directory: web
        run: npx momentic@latest results upload test-results
