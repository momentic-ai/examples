version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  run-tests:
    docker:
      - image: cimg/node:24.0
    resource_class: large
    parallelism: 2
    working_directory: ~/project/web
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: npm --prefix ../ ci
      # archive.ubuntu.com is often slow or unreachable from cloud runners; use
      # Azure's Ubuntu mirror for the system packages Chromium needs.
      - run:
          name: Use Azure's Ubuntu mirror
          command: |
            sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
            printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
      - run:
          name: Install Browsers
          # apt keeps printing progress while stuck, so no_output_timeout alone never fires
          command: timeout 10m npx momentic install-browsers chromium
          no_output_timeout: 5m
      - run:
          name: Run tests
          command: |
            npx momentic run \
              --exclude autoheal-test-authorship-demo \
              --output-dir test-results/shard-${CIRCLE_NODE_INDEX} \
              --shard-index $(($CIRCLE_NODE_INDEX+1)) \
              --shard-count ${CIRCLE_NODE_TOTAL}
      - store_artifacts:
          when: always
          path: ./test-results
      - persist_to_workspace:
          when: always
          root: .
          paths:
            - test-results
  upload-results:
    docker:
      - image: cimg/node:24.0
    working_directory: ~/project/web
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: npm --prefix ../ ci
      - attach_workspace:
          at: .
      - run:
          name: Merge test results
          command: npx momentic results merge --output-dir test-results/merged test-results
      - run:
          name: Upload test results
          command: npx momentic results upload test-results/merged

workflows:
  UI_Tests:
    jobs:
      - run-tests
      - upload-results:
          requires:
            - run-tests
