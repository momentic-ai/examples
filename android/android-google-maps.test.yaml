fileType: momentic/mobile-test/v2
id: 8cf714f8-6561-4677-b0e5-cfc97817708d
description: Search for Italian restaurants in San Francisco and inspect a review
platform: android
defaultChannel: google-maps
defaultTag: latest
retries: 1
steps:
  - openApp:
      package: com.google.android.apps.maps
      activity: ""
  - Skip sign-in and dismiss any first-run prompts
  - module: ./search-restaurants.module.yaml
  - assert: At least five restaurant options are visible
  - Open the first restaurant result and navigate to its Reviews tab
  - assert: The restaurant shows directions and at least one customer review
